<div
  *ngIf="mostrar"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center h-screen z-50"
>
  <div
    class="relative bg-[#9a9a76] p-8 border border-white max-w-sm w-full mx-4 rounded-lg shadow-lg z-50"
  >
    <button
      (click)="cerrarModal()"
      class="absolute top-2 right-4 text-white text-2xl font-bold"
    >
      &times;
    </button>

    <div class="border border-white p-6 text-center text-white">
      
      <img
        src="https://latarjetadigital.com.ar/wp-content/uploads/2024/11/ffffff-blanco-icono-32.gif"
        alt="Ícono Tarjeta"
        width="70"
        height="70"
        loading="lazy"
        class="mx-auto mb-2"
      />

      <h2 class="text-3xl font-bold mb-4 italic">TARJETA</h2>

      <div class="mb-6">
        <p class="text-lg font-bold">VALOR POR PERSONA:</p>
        <p class="text-xl">MAYORES: $80.000</p>
        <p class="text-xl">MENORES (2 A 14 AÑOS): $40.000</p>
      </div>

      <hr class="border-white mb-6" />

      <div class="mb-6">
        <p class="mb-2">PODÉS REALIZAR EL PAGO AL SIGUIENTE ALIAS:</p>
        <p class="text-2xl font-black bg-white text-[#9a9a76] py-1 rounded">
          FLAVIASALVO.MP
        </p>
        <p class="mt-2 text-sm">TITULAR: FLAVIA GISELA SALVO</p>
      </div>

      <p class="text-sm font-bold leading-tight">
        UNA VEZ REALIZADA LA TRANSFERENCIA,<br /> 
        POR FAVOR ENVIANOS EL COMPROBANTE <br />
        PARA CONFIRMAR TU LUGAR.
      </p>

      <p class="mt-6 font-bold">¡MUCHAS GRACIAS!</p>
    </div>
  </div>
</div>
